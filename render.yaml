services:
  - type: web
    runtime: static
    name: at-home-kitchen-web
    buildCommand: echo "Static Kitchen site ready"
    staticPublishPath: ./site
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
