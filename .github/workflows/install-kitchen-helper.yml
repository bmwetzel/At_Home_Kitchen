name: Install hosted Kitchen Helper
on:
  push:
    paths:
      - "site/kitchen-assistant-local.js"
      - "site/kitchen-chatgpt-personal-bridge.js"
      - "scripts/inject_hosted_assistant.py"
      - ".github/workflows/install-kitchen-helper.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kitchen source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check Kitchen Assistant JavaScript
        run: |
          node --check site/kitchen-assistant-local.js
          node --check site/kitchen-chatgpt-personal-bridge.js
      - name: Insert both assistants into HTML
        run: python3 scripts/inject_hosted_assistant.py
      - name: Commit updated website if needed
        shell: bash
        run: |
          if git diff --quiet -- site/index.html; then
            echo "Both assistant scripts are already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "Connect personal ChatGPT handoff to Kitchen Assistant"
          git push origin HEAD:main
